<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalizar compra — VELMONT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body style="background:var(--ivory); color:var(--ink)">

  <header style="display:flex;justify-content:center;padding:var(--s6) 0;border-bottom:1px solid var(--hairline)">
    <a href="/"><img src="assets/img/logo/velmont-wordmark.png" alt="VELMONT" style="height:24px"></a>
  </header>

  <main class="ck">
    <section class="ck__form">
      <div>
        <span class="section-index">01 — Contacto</span>
      </div>
      <div class="field">
        <label class="label" for="mail">Correo electrónico</label>
        <input id="mail" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="label" for="nom">Nombre</label>
          <input id="nom" type="text" autocomplete="given-name">
        </div>
        <div class="field">
          <label class="label" for="ape">Apellido</label>
          <input id="ape" type="text" autocomplete="family-name">
        </div>
      </div>

      <div style="margin-top:var(--s6)">
        <span class="section-index">02 — Envío</span>
      </div>
      <div class="field">
        <label class="label" for="dir">Dirección</label>
        <input id="dir" type="text" autocomplete="street-address">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="label" for="ciu">Ciudad</label>
          <input id="ciu" type="text" autocomplete="address-level2">
        </div>
        <div class="field">
          <label class="label" for="dep">Departamento</label>
          <input id="dep" type="text" autocomplete="address-level1">
        </div>
      </div>

      <div style="margin-top:var(--s6)">
        <span class="section-index">03 — Pago</span>
      </div>
      <div class="field">
        <label class="label" for="pago">Método</label>
        <select id="pago">
          <option>PSE</option>
          <option>Tarjeta de crédito o débito</option>
          <option>Nequi</option>
        </select>
      </div>

      <button class="act act--solid" disabled style="justify-content:center;margin-top:var(--s5)">Pagar</button>
      <p class="fine">Esta pantalla es una vista previa de continuidad visual. La pasarela de pago real se conecta del lado de Shopify.</p>
    </section>

    <aside class="ck__summary">
      <span class="label">Tu selección</span>
      <div data-ck-lines style="margin-top:var(--s4)"></div>
      <div class="ck__totals" data-ck-totals></div>
    </aside>
  </main>

<script type="module" src="assets/js/checkout-preview.js"></script>
</body>
</html>
